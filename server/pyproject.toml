[project]
name = "kb-server"
version = "0.1.0"
description = "灵知 (Gnosis) 后端 (FastAPI): 文件解析、embedding、多数据源。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KB Team" }]

dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Optional datasource clients. Install only the ones you need:
es = ["elasticsearch>=8.12,<9"]
pg = ["psycopg[binary,pool]>=3.1", "pgvector>=0.3"]
mysql = ["PyMySQL>=1.1"]
vector = ["pymilvus>=2.4"]
parsers = ["openpyxl>=3.1", "python-docx>=1.1", "pdfplumber>=0.10", "markdown-it-py>=3.0"]
embedding-local = ["sentence-transformers>=2.7", "FlagEmbedding>=1.2"]
embedding-remote = []  # uses httpx already
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"